name: HakoClient
options:
  bundleIdPrefix: org.example.hako
  deploymentTarget:
    iOS: '15.0'
    macOS: '13.0'
    tvOS: '17.0'
settings:
  base:
    HAKO_BUNDLE_BASE: org.example.hako
    HAKO_APP_GROUP: group.$(HAKO_BUNDLE_BASE)
    HAKO_ICLOUD_CONTAINER: iCloud.$(HAKO_BUNDLE_BASE)
    HAKO_DEVELOPMENT_TEAM: ''
    SWIFT_VERSION: '5.9'
    GENERATE_INFOPLIST_FILE: true
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.9
    HAKO_SOURCE_REVISION: source-build
    OTHER_LDFLAGS:
    - -lresolv
packages:
  HakoClientKit:
    path: ../HakoClientKit
  HakoClientUI:
    path: ../HakoClientUI
  HakoMacClient:
    path: ../HakoMacClient
targets:
  HakoClient:
    type: application
    platform: iOS
    sources:
    - path: Sources
      excludes:
      - Mac
      - TV
    - Shared
    - Assets.xcassets
    - Resources/Branding/SharedSymbols.xcassets
    - path: Resources/Branding/AppIcon/AppIcon.icon
      buildPhase: resources
    - path: Resources/PrivacyInfo.xcprivacy
      buildPhase: resources
    - path: Resources/Legal
      buildPhase: resources
    - path: Resources/BundledGeoData/GeoSite.dat.xz
      buildPhase: resources
    - path: Resources/BundledGeoData/geoip.metadb.xz
      buildPhase: resources
    - path: Resources/BundledGeoData/BundledGeoDataManifest.json
      buildPhase: resources
    - path: Resources/BundledGeoData/LICENSE.meta-rules-dat.txt
      buildPhase: resources
    - path: ../../Vendor/HakoAdapter/Sources/HakoAdapter
    settings:
      configs:
        Debug:
          INFOPLIST_KEY_UIFileSharingEnabled: 'YES'
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HAKO_BUNDLE_BASE)
        DEVELOPMENT_TEAM: $(HAKO_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: false
        REMOVE_HEADERS_FROM_EMBEDDED_FRAMEWORKS: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Clash
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HakoSourceRevision: $(HAKO_SOURCE_REVISION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationPortraitUpsideDown
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Scan a subscription QR code to import a profile.
        NSLocalNetworkUsageDescription: Test DNS servers on your network, and let
          other devices use this device's proxy.
        CFBundleURLTypes:
        - CFBundleTypeRole: Editor
          CFBundleURLSchemes:
          - clash
          - clashmeta
          - flclash
          - hako
        CFBundleDocumentTypes:
        - CFBundleTypeName: YAML Configuration
          CFBundleTypeRole: Viewer
          LSHandlerRank: Alternate
          LSItemContentTypes:
          - public.yaml
        LSSupportsOpeningDocumentsInPlace: true
        BGTaskSchedulerPermittedIdentifiers:
        - $(HAKO_BUNDLE_BASE).refresh
        UIBackgroundModes:
        - fetch
        - processing
        NSUbiquitousContainers:
          iCloud.org.example.hako:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Clash
            NSUbiquitousContainerSupportedFolderLevels: Any
    entitlements:
      path: HakoClient.entitlements
      properties:
        com.apple.security.application-groups:
        - $(HAKO_APP_GROUP)
        com.apple.developer.networking.networkextension:
        - packet-tunnel-provider
        - dns-settings
        com.apple.developer.icloud-services:
        - CloudDocuments
        - CloudKit
        com.apple.developer.icloud-container-identifiers:
        - $(HAKO_ICLOUD_CONTAINER)
        com.apple.developer.ubiquity-container-identifiers:
        - $(HAKO_ICLOUD_CONTAINER)
    dependencies:
    - package: HakoClientKit
    - package: HakoClientUI
    - target: Hako
      embed: true
    - target: HakoClientExtension
      embed: true
    - target: HakoControlsExtension
      embed: true
    - target: HakoShareExtension
      embed: true
  Hako:
    type: framework
    platform: iOS
    sources:
    - path: HakoCore
    settings:
      configs:
        Release:
          DEPLOYMENT_POSTPROCESSING: true
          STRIP_INSTALLED_PRODUCT: true
          STRIP_STYLE: non-global
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HAKO_BUNDLE_BASE).core
        DEVELOPMENT_TEAM: $(HAKO_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        DEFINES_MODULE: true
        MODULEMAP_FILE: HakoCore/module.modulemap
        SKIP_INSTALL: true
        ENABLE_USER_SCRIPT_SANDBOXING: false
        HAKO_CORE_SLICE[sdk=iphoneos*]: ios-arm64
        HAKO_CORE_SLICE[sdk=iphonesimulator*]: ios-arm64_x86_64-simulator
        HAKO_CORE_ARCHIVE: $(SRCROOT)/../../Hako.xcframework/$(HAKO_CORE_SLICE)/Hako.framework/Hako
        OTHER_LDFLAGS:
        - -Wl,-force_load,$(HAKO_CORE_ARCHIVE)
        - -lresolv
    preBuildScripts:
    - name: Copy the Go core's public headers out of the locked xcframework
      shell: /bin/sh
      script: "set -eu\nsrc=\"$SRCROOT/../../Hako.xcframework/$HAKO_CORE_SLICE/Hako.framework/Headers\"\
        \ndst=\"$TARGET_BUILD_DIR/$PUBLIC_HEADERS_FOLDER_PATH\"\nmkdir -p \"$dst\"\
        \nfor h in ref.h Hako.objc.h Universe.objc.h Hako.h; do\n  cp -f \"$src/$h\"\
        \ \"$dst/$h\"\ndone\n"
      outputFiles:
      - $(TARGET_BUILD_DIR)/$(PUBLIC_HEADERS_FOLDER_PATH)/ref.h
      - $(TARGET_BUILD_DIR)/$(PUBLIC_HEADERS_FOLDER_PATH)/Hako.objc.h
      - $(TARGET_BUILD_DIR)/$(PUBLIC_HEADERS_FOLDER_PATH)/Universe.objc.h
      - $(TARGET_BUILD_DIR)/$(PUBLIC_HEADERS_FOLDER_PATH)/Hako.h
  HakoClientExtension:
    type: app-extension
    platform: iOS
    sources:
    - path: Extension
      excludes: []
    - Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Widgets/HakoWidgetSnapshot.swift
      group: Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Widgets/HakoWidgetMailbox.swift
      group: Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Widgets/HakoWidgetInterfaceAccounting.swift
      group: Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Tunnel/HakoTunnelRouteShaping.swift
    - path: Resources/PrivacyInfo.xcprivacy
      buildPhase: resources
    - path: ../../Vendor/HakoAdapter/Sources/HakoAdapter
    settings:
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HAKO_BUNDLE_BASE).extension
        DEVELOPMENT_TEAM: $(HAKO_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS:
        - $(inherited)
        - '@executable_path/Frameworks'
        - '@executable_path/../../Frameworks'
    entitlements:
      path: Extension/Extension.entitlements
      properties:
        com.apple.security.application-groups:
        - $(HAKO_APP_GROUP)
        com.apple.developer.networking.networkextension:
        - packet-tunnel-provider
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Clash by Hako
        CFBundleShortVersionString: '1.0'
        CFBundleVersion: '1'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    dependencies:
    - target: Hako
      embed: false
    - sdk: NetworkExtension.framework
  HakoControlsExtension:
    type: app-extension
    platform: iOS
    sources:
    - ControlsExtension
    - WidgetsShared
    - path: Sources/SystemIntegration/HakoSystemRoute.swift
    - path: Sources/SystemIntegration/HakoVPNControlIntent.swift
    - path: Shared/HakoLogStore.swift
      group: Sources/SystemIntegration
    - path: Shared/HakoAppGroupContainer.swift
      group: Sources/SystemIntegration
    - path: Shared/HakoAppIdentifiers.swift
    - path: Shared/HakoDeviceModel.swift
      group: Sources/SystemIntegration
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Widgets/HakoWidgetSnapshot.swift
      group: Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Widgets/HakoWidgetMailbox.swift
      group: Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Widgets/HakoWidgetFormat.swift
    - path: ../HakoClientUI/Sources/HakoClientUI/Design/HakoThroughputFormatter.swift
      group: Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Widgets/HakoWidgetViews.swift
      group: Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Design/HakoCopy.swift
      group: Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Design/HakoRegionalFlag.swift
      group: Shared
    - path: Sources/AppArchitecture/AppLocalization
      excludes:
      - '**/InfoPlist.strings'
    - path: Resources/Branding/SharedSymbols.xcassets
    - path: Resources/PrivacyInfo.xcprivacy
      buildPhase: resources
    settings:
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HAKO_BUNDLE_BASE).controls
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        DEVELOPMENT_TEAM: $(HAKO_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: true
    entitlements:
      path: ControlsExtension/ControlsExtension.entitlements
      properties:
        com.apple.security.application-groups:
        - $(HAKO_APP_GROUP)
    info:
      path: ControlsExtension/Info.plist
      properties:
        CFBundleDisplayName: Clash Controls
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
    - sdk: AppIntents.framework
    - sdk: WidgetKit.framework
  HakoShareExtension:
    type: app-extension
    platform: iOS
    sources:
    - ShareExtension
    - path: Sources/SystemIntegration/ProfileShareInbox.swift
    - path: Shared/HakoAppIdentifiers.swift
    - path: Shared/HakoDeviceModel.swift
      group: Sources/SystemIntegration
    - path: Shared/HakoAppGroupContainer.swift
      group: Sources/SystemIntegration
    - path: Resources/PrivacyInfo.xcprivacy
      buildPhase: resources
    settings:
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HAKO_BUNDLE_BASE).share
        DEVELOPMENT_TEAM: $(HAKO_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: true
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
        - $(HAKO_APP_GROUP)
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Import to Clash
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: SUBQUERY(extensionItems, $extensionItem, $extensionItem.attachments.@count
              == 1 AND SUBQUERY($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers
              UTI-CONFORMS-TO "public.yaml").@count == 1).@count == 1
  HakoMac:
    type: application
    platform: macOS
    productName: Clash
    sources:
    - path: Sources
      excludes:
      - TV
      - HakoClientApp.swift
      - HakoNavigationLab.swift
      - HakoPushClockTouchProbe.swift
      - VPNController.swift
      - HakoComponents.swift
      - OverviewComponents.swift
      - OverviewContent.swift
      - OverviewDetailCards.swift
      - OverviewPrimaryCards.swift
      - HomeView.swift
      - NodesView.swift
      - ConfigUI/GoldenFlowHomeView.swift
      - ConfigUI/TunnelSettingsView.swift
    - Shared
    - Assets.xcassets
    - Resources/Branding/SharedSymbols.xcassets
    - path: Resources/Branding/AppIcon/AppIcon.icon
      buildPhase: resources
    - path: Resources/Branding/AppIcon/macOS/HakoAppIcon.icns
      buildPhase: resources
    - path: Resources/PrivacyInfo.xcprivacy
      buildPhase: resources
    - path: Resources/Legal
      buildPhase: resources
    - path: Resources/BundledGeoData/GeoSite.dat.xz
      buildPhase: resources
    - path: Resources/BundledGeoData/geoip.metadb.xz
      buildPhase: resources
    - path: Resources/BundledGeoData/BundledGeoDataManifest.json
      buildPhase: resources
    - path: Resources/BundledGeoData/LICENSE.meta-rules-dat.txt
      buildPhase: resources
    - path: ../../Vendor/HakoAdapter/Sources/HakoAdapter
    settings:
      configs:
        Release: {}
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HAKO_BUNDLE_BASE)
        PRODUCT_NAME: Clash
        MARKETING_VERSION: 1.0.11
        CURRENT_PROJECT_VERSION: '55'
        DEVELOPMENT_TEAM: $(HAKO_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: false
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
    info:
      path: Resources/macOS/HakoMacInfo.plist
      properties:
        CFBundleDisplayName: Clash
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleIconName: AppIcon
        CFBundleIconFile: HakoAppIcon
        CFBundleURLTypes:
        - CFBundleTypeRole: Editor
          CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).install-config
          CFBundleURLSchemes:
          - clash
          - clashmeta
          - flclash
          - hako
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HakoSourceRevision: $(HAKO_SOURCE_REVISION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    entitlements:
      path: Resources/macOS/HakoMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.application-groups:
        - $(HAKO_APP_GROUP)
        com.apple.developer.networking.networkextension:
        - packet-tunnel-provider
        com.apple.developer.icloud-services:
        - CloudDocuments
        - CloudKit
        com.apple.developer.icloud-container-identifiers:
        - $(HAKO_ICLOUD_CONTAINER)
        com.apple.developer.ubiquity-container-identifiers:
        - $(HAKO_ICLOUD_CONTAINER)
    dependencies:
    - package: HakoClientKit
    - package: HakoClientUI
    - package: HakoMacClient
    - framework: ../../Hako.xcframework
      embed: false
    - target: HakoMacExtension
      embed: true
    - target: HakoMacWidgets
      embed: true
    - sdk: NetworkExtension.framework
  HakoMacWidgets:
    type: app-extension
    platform: macOS
    sources:
    - path: MacWidgets
      excludes:
      - Info.plist
      - MacWidgets.entitlements
    - path: WidgetsShared
    - path: Sources/SystemIntegration/HakoSystemRoute.swift
    - path: Sources/SystemIntegration/HakoVPNControlIntent.swift
    - path: Shared/HakoLogStore.swift
      group: Sources/SystemIntegration
    - path: Shared/HakoAppGroupContainer.swift
      group: Sources/SystemIntegration
    - path: Shared/HakoAppIdentifiers.swift
    - path: Shared/HakoDeviceModel.swift
      group: Sources/SystemIntegration
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Widgets/HakoWidgetSnapshot.swift
      group: Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Widgets/HakoWidgetMailbox.swift
      group: Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Widgets/HakoWidgetFormat.swift
    - path: ../HakoClientUI/Sources/HakoClientUI/Design/HakoThroughputFormatter.swift
      group: Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Widgets/HakoWidgetViews.swift
      group: Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Design/HakoCopy.swift
      group: Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Design/HakoRegionalFlag.swift
      group: Shared
    - path: Sources/AppArchitecture/AppLocalization
      excludes:
      - '**/InfoPlist.strings'
    - path: Resources/Branding/SharedSymbols.xcassets
    - path: Resources/PrivacyInfo.xcprivacy
      buildPhase: resources
    settings:
      configs:
        Release: {}
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HAKO_BUNDLE_BASE).widgets
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        DEVELOPMENT_TEAM: $(HAKO_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: true
    entitlements:
      path: MacWidgets/MacWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
        - $(HAKO_APP_GROUP)
        com.apple.developer.networking.networkextension:
        - packet-tunnel-provider
    info:
      path: MacWidgets/Info.plist
      properties:
        CFBundleDisplayName: Clash
        HakoSourceRevision: $(HAKO_SOURCE_REVISION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  HakoMacExtension:
    type: app-extension
    platform: macOS
    sources:
    - path: Extension
      excludes:
      - Extension.entitlements
      - Info.plist
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Widgets/HakoWidgetSnapshot.swift
      group: Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Widgets/HakoWidgetMailbox.swift
      group: Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Widgets/HakoWidgetInterfaceAccounting.swift
      group: Shared
    - Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Tunnel/HakoTunnelRouteShaping.swift
    - path: Resources/PrivacyInfo.xcprivacy
      buildPhase: resources
    - path: ../../Vendor/HakoAdapter/Sources/HakoAdapter
    settings:
      configs:
        Release: {}
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HAKO_BUNDLE_BASE).packet-tunnel
        PRODUCT_NAME: HakoMacExtension
        MARKETING_VERSION: 1.0.11
        CURRENT_PROJECT_VERSION: '55'
        DEVELOPMENT_TEAM: $(HAKO_DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: Resources/macOS/HakoMacExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.server: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
        - $(HAKO_APP_GROUP)
        com.apple.developer.networking.networkextension:
        - packet-tunnel-provider
    info:
      path: Resources/macOS/HakoMacExtensionInfo.plist
      properties:
        CFBundleDisplayName: Clash by Hako
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HakoSourceRevision: $(HAKO_SOURCE_REVISION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    dependencies:
    - framework: ../../Hako.xcframework
      embed: false
    - sdk: NetworkExtension.framework
  HakoTV:
    type: application
    platform: tvOS
    sources:
    - path: Sources/TV
    - path: Shared/ConfigResourceStore.swift
    - path: Shared/HakoAppIdentifiers.swift
    - path: Shared/HakoDeviceModel.swift
      group: Shared
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Rules/HakoRulesSnapshot.swift
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Proxies/HakoProbeFailureCopy.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Components/InheritedValue.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Components/InheritedList.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/DNS/HakoDNSSnapshot.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Proxies/HakoProxiesSnapshot.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Proxies/HakoProxiesRuntime.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Proxies/HakoProxyGroupIcon.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Activity/HakoActivitySnapshot.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Activity/HakoActivityProjectionMemo.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Profiles/HakoProfilesSnapshot.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Home/HakoConnectionDuration.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Home/HakoHomeStatusLine.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Home/HakoHomeSnapshot.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Home/HakoHomeCatalog.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Features/Home/HakoStartupExplanation.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Design/HakoCopy.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Design/HakoAccentRole.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Design/HakoSymbol.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Design/HakoSurfaceRole.swift
      group: SharedFacts
    - path: ../HakoClientUI/Sources/HakoClientUI/Design/HakoThroughputFormatter.swift
      group: SharedFacts
    - path: Sources/ConfigStore/ConfigTransforms.swift
    - path: Sources/ConfigStore/InvalidDomainSites.swift
    - path: Sources/ConfigStore/OrderedJSON.swift
    - path: Sources/ConfigStore/PreflightService.swift
    - path: Sources/ConfigStore/AppCoreSetup.swift
    - path: Sources/ConfigStore/BundledGeodataProvisioner.swift
    - path: Sources/ConfigStore/GeoSiteCompiler.swift
    - path: Sources/ConfigStore/GeoIPCompiler.swift
    - path: Sources/ConfigStore/ProviderStagingPublisher.swift
    - path: Sources/AppArchitecture/UDPFallbackGuard.swift
    - path: Sources/AppArchitecture/ProxyBrowsingVisibility.swift
    - path: Sources/AppArchitecture/ProxyImportBridge.swift
    - path: Sources/ConfigStore/SubscriptionError.swift
    - path: Shared/LocalNetworkPermission.swift
    - path: Sources/ConfigStore/CoreLogExcerpt.swift
    - path: Sources/ProxyShareModel.swift
    - path: Sources/ProfileListenerPorts.swift
    - path: Sources/ConfigStore/CredentialStore.swift
    - path: Sources/ConfigUI/ClientUserAgent.swift
    - path: Sources/ConfigUI/IPStackSettings.swift
    - path: Sources/ConfigUI/IPStackSettingsApplication.swift
    - path: Sources/VPNStartAuthorization.swift
    - path: Shared/HakoLogStore.swift
      group: Shared
    - path: Shared/HakoAppGroupContainer.swift
      group: Shared
    - path: Resources/BundledGeoData/GeoSite.dat.xz
      buildPhase: resources
    - path: Resources/BundledGeoData/geoip.metadb.xz
      buildPhase: resources
    - path: Resources/BundledGeoData/BundledGeoDataManifest.json
      buildPhase: resources
    - path: Resources/BundledGeoData/LICENSE.meta-rules-dat.txt
      buildPhase: resources
    - path: Resources/PrivacyInfo.xcprivacy
      buildPhase: resources
    - path: Resources/Branding/AppIcon/tvOS/HakoTVAssets.xcassets
      buildPhase: resources
    - path: Resources/Branding/SharedSymbols.xcassets
      buildPhase: resources
